<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn AI Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-linkedin me-2"></i>AI Manager</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/trends">Trends</a></li>
                    <li class="nav-item"><a class="nav-link" href="/plans">Plans</a></li>
                    <li class="nav-item"><a class="nav-link" href="/posts">Posts</a></li>
                    <li class="nav-item"><a class="nav-link" href="/run-agents">Run Agents</a></li>
                </ul>
                <!-- LinkedIn Status Badge -->
                <div id="linkedin-status" class="d-flex align-items-center">
                    <span class="badge bg-secondary" id="linkedin-badge">
                        <i class="bi bi-linkedin me-1"></i>Checking...
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100;">
        <div id="toast-notification" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toast-title">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message"></div>
        </div>
    </div>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check LinkedIn connection status
        async function checkLinkedInStatus() {
            try {
                const res = await fetch('/api/linkedin/status');
                const data = await res.json();
                const badge = document.getElementById('linkedin-badge');

                if (data.connected) {
                    badge.className = 'badge bg-success';
                    badge.innerHTML = '<i class="bi bi-linkedin me-1"></i>Connected';
                } else {
                    badge.className = 'badge bg-warning text-dark';
                    badge.innerHTML = '<a href="/linkedin/auth" class="text-dark text-decoration-none"><i class="bi bi-linkedin me-1"></i>Connect</a>';
                }
            } catch (e) {
                console.error('LinkedIn status check failed:', e);
            }
        }

        // Toast notification function
        function showToast(title, message, type = 'info') {
            const toast = document.getElementById('toast-notification');
            const toastTitle = document.getElementById('toast-title');
            const toastMessage = document.getElementById('toast-message');

            toastTitle.textContent = title;
            toastMessage.textContent = message;

            // Set color based on type
            toast.className = 'toast';
            if (type === 'success') toast.classList.add('bg-success', 'text-white');
            else if (type === 'error') toast.classList.add('bg-danger', 'text-white');

            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }

        // Check for URL params (OAuth success/error)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('linkedin_connected')) {
            showToast('Success', 'LinkedIn connected successfully!', 'success');
        }
        if (urlParams.get('linkedin_error')) {
            showToast('Error', 'LinkedIn connection failed: ' + urlParams.get('linkedin_error'), 'error');
        }

        // Check status on load
        checkLinkedInStatus();
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
