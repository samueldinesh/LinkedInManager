{% extends "base.html" %}

{% block content %}
    <h1 class="mb-4">Weekly Plans</h1>
    <div class="row">
        {% for plan in plans %}
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <strong>Week of {{ plan.week_start.strftime('%Y-%m-%d') }}</strong>
                        <span class="badge bg-{{ 'success' if plan.status == 'approved' else 'warning' }}">{{ plan.status }}</span>
                    </div>
                    <div class="card-body">
                        <p>Created: {{ plan.created_at.strftime('%Y-%m-%d %H:%M') }}</p>
                        <a href="/plans/{{ plan.id }}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="col-12">
                <p class="text-center">No weekly plans created yet.</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
